# ============================================================
# nginx — ReservSlot
# Copia este server block dentro de tu nginx.conf (dentro de "http { ... }").
#
# Arquitectura:
#   /            -> SPA Angular (base-href /)
#   /api/        -> proxy al backend Go (REST + SSE)
#   /public/     -> imágenes de ambientes (servidas por nginx)
#
# El backend Go debe escuchar en 127.0.0.1:8080 (SERVER_PORT=:8080).
# ============================================================

server {
    listen       5000;
    server_name  localhost;

    # 10 MB por imagen; el backend acepta hasta 10 imágenes por request.
    client_max_body_size 110M;

    # ---------- SPA Angular ----------
    location / {
        alias "C:/nginx/nginx-1.28.0/html/reservslot/";
        try_files $uri $uri/ /index.html;
    }

    # ---------- Imágenes públicas de ambientes ----------
    location /public/ {
        alias "C:/nginx/nginx-1.28.0/html/reservslot/public/";
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # ---------- SSE (un único stream multiplexado) ----------
    location = /api/events {
        proxy_pass http://127.0.0.1:8080/events;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- API Go (REST) ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
