@if (item.submenu) {
  <button
    type="button"
    class="toggleLabel"
    (click)="toggle()"
    [attr.aria-label]="item.label"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="'submenu-' + item.key"
  >
    <div class="toggleContent">
      @if (item.icon) {
        <ng-container
          [ngComponentOutlet]="item.icon.component"
          [ngComponentOutletInputs]="item.icon.inputs || {}"
        />
      }
      @if (!collapsed) {
        <span class="menuText">{{ item.label }}</span>
      }
    </div>
    @if (!collapsed) {
      <span class="arrow" [class.open]="isOpen()" aria-hidden="true">▶</span>
    }
  </button>
  @if (isOpen()) {
    <div class="submenu" [id]="'submenu-' + item.key">
      <ul class="menuList">
        @for (child of item.submenu; track child.key) {
          <li>
            <sidebar-menu-item [item]="child" [collapsed]="collapsed" />
          </li>
        }
      </ul>
    </div>
  }
} @else {
  <a
    class="button"
    [class.active]="isActive(item.path)"
    [routerLink]="item.path"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
    [attr.aria-label]="item.label"
    [title]="item.label"
  >
    @if (item.icon) {
      <ng-container
        [ngComponentOutlet]="item.icon.component"
        [ngComponentOutletInputs]="item.icon.inputs || {}"
      />
    }
    @if (!collapsed) {
      <span class="menuText">{{ item.label }}</span>
    }
  </a>
}
