<div class="overlay" (click)="close()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ isEditing() ? 'Editar ocupación' : 'Nueva ocupación' }}</h2>
      <button class="close-btn" (click)="close()">&times;</button>
    </div>

    <form (ngSubmit)="onSubmit()" class="modal-body">
      <div class="grid">
        <div class="field">
          <label>Inicio *</label>
          <input type="datetime-local" [(ngModel)]="form.inicio" name="inicio" required />
        </div>
        <div class="field">
          <label>Fin *</label>
          <input type="datetime-local" [(ngModel)]="form.fin" name="fin" required />
        </div>
        <div class="field field--full field--checkbox">
          <label>
            <input type="checkbox" [(ngModel)]="form.activo" name="activo" />
            Activo
          </label>
        </div>
      </div>

      @if (error()) {
        <div class="form-error">{{ error() }}</div>
      }

      <div class="modal-actions">
        <button type="button" class="btn btn--secondary" (click)="close()">Cancelar</button>
        <button type="submit" class="btn btn--primary" [disabled]="saving()">
          {{ saving() ? 'Guardando...' : 'Guardar' }}
        </button>
      </div>
    </form>
  </div>
</div>
