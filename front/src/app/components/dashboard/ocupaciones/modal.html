<app-modal
  [title]="isEditing() ? 'Editar ocupación' : 'Nueva ocupación'"
  [closeOnBackdrop]="false"
  (closed)="close()"
>
  <form (ngSubmit)="onSubmit()">
    <div class="form-grid form-grid--single">
      <div class="field">
        <label for="ocupacion-inicio">Inicio *</label>
        <input
          id="ocupacion-inicio"
          type="datetime-local"
          [(ngModel)]="form.inicio"
          name="inicio"
          required
        />
      </div>
      <div class="field">
        <label for="ocupacion-fin">Fin *</label>
        <input
          id="ocupacion-fin"
          type="datetime-local"
          [(ngModel)]="form.fin"
          name="fin"
          required
        />
      </div>
      <div class="field field--checkbox">
        <label>
          <input type="checkbox" [(ngModel)]="form.activo" name="activo" />
          Activo
        </label>
      </div>
    </div>

    @if (error()) {
      <div class="form-error" role="alert">{{ error() }}</div>
    }

    <div class="modal-actions">
      <button type="button" class="btn btn--secondary" (click)="close()">Cancelar</button>
      <button type="submit" class="btn btn--primary" [disabled]="saving()">
        {{ saving() ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </form>
</app-modal>
