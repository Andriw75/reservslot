<div class="page-header">
  <h1>Categorías</h1>
  <button class="btn btn--primary" (click)="openCreate()">+ Nueva categoría</button>
</div>

<div class="table-wrapper">
  <table class="table">
    <thead>
      <tr>
        <th scope="col">ID</th>
        <th scope="col">Color</th>
        <th scope="col">Nombre</th>
        <th scope="col">Descripción</th>
        <th scope="col">Activo</th>
        <th scope="col">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (categoria of categorias(); track categoria.id) {
        <tr>
          <td>{{ categoria.id }}</td>
          <td>
            <span
              class="color-swatch"
              role="img"
              [style.background]="categoria.color || 'var(--border)'"
              [attr.aria-label]="'Color ' + (categoria.color || 'sin definir')"
            ></span>
          </td>
          <td>
            <strong>{{ categoria.nombre }}</strong>
          </td>
          <td>{{ categoria.descripcion }}</td>
          <td>
            @if (categoria.activo) {
              <span class="badge badge--activo">Sí</span>
            } @else {
              <span class="badge badge--inactivo">No</span>
            }
          </td>
          <td>
            <div class="row-actions">
              <button
                class="icon-btn"
                title="Editar"
                aria-label="Editar categoría"
                (click)="openEdit(categoria)"
              >
                ✏️
              </button>
              <button
                class="icon-btn"
                title="Eliminar"
                aria-label="Eliminar categoría"
                (click)="confirmDelete(categoria)"
                [disabled]="deleting() === categoria.id"
              >
                🗑️
              </button>
            </div>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="6" class="empty">No hay categorías registradas</td>
        </tr>
      }
    </tbody>
  </table>
</div>

@if (showModal()) {
  <app-categoria-modal
    [categoria]="selected()"
    (onClose)="showModal.set(false)"
    (onSaved)="onSaved()"
  />
}
