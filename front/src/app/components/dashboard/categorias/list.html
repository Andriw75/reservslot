<div class="page-header">
  <h1>Categorías</h1>
  <button class="btn btn--primary" (click)="openCreate()">+ Nueva categoría</button>
</div>

<div class="table-wrapper">
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Color</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Activo</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (categoria of categorias(); track categoria.id) {
        <tr>
          <td>{{ categoria.id }}</td>
          <td>
            <span class="color-swatch" [style.background]="categoria.color || '#e2e8f0'"></span>
          </td>
          <td>
            <strong>{{ categoria.nombre }}</strong>
          </td>
          <td>{{ categoria.descripcion }}</td>
          <td>
            @if (categoria.activo) {
              <span class="badge badge--activo">Sí</span>
            } @else {
              <span class="badge badge--inactivo">No</span>
            }
          </td>
          <td>
            <button class="btn-icon" title="Editar" (click)="openEdit(categoria)">✏️</button>
            <button
              class="btn-icon"
              title="Eliminar"
              (click)="confirmDelete(categoria)"
              [disabled]="deleting() === categoria.id"
            >
              🗑️
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="6" class="empty">No hay categorías registradas</td>
        </tr>
      }
    </tbody>
  </table>
</div>

@if (showModal()) {
  <app-categoria-modal
    [categoria]="selected()"
    (onClose)="showModal.set(false)"
    (onSaved)="onSaved()"
  />
}
