<app-modal [title]="isEditing() ? 'Editar categoría' : 'Nueva categoría'" (closed)="close()">
  <form (ngSubmit)="onSubmit()">
    <div class="form-grid">
      <div class="field field--full">
        <label for="categoria-nombre">Nombre *</label>
        <input id="categoria-nombre" type="text" [(ngModel)]="form.nombre" name="nombre" required />
      </div>
      <div class="field field--full">
        <label for="categoria-descripcion">Descripción</label>
        <textarea
          id="categoria-descripcion"
          [(ngModel)]="form.descripcion"
          name="descripcion"
          rows="3"
        ></textarea>
      </div>
      <div class="field">
        <label for="categoria-color">Color</label>
        <input
          id="categoria-color"
          type="color"
          [ngModel]="form.color || '#0f766e'"
          (ngModelChange)="form.color = $event"
          name="color"
        />
      </div>
      <div class="field field--checkbox">
        <label>
          <input type="checkbox" [(ngModel)]="form.activo" name="activo" />
          Activo
        </label>
      </div>
    </div>

    @if (error()) {
      <div class="form-error" role="alert">{{ error() }}</div>
    }

    <div class="modal-actions">
      <button type="button" class="btn btn--secondary" (click)="close()">Cancelar</button>
      <button type="submit" class="btn btn--primary" [disabled]="saving()">
        {{ saving() ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </form>
</app-modal>
